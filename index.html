<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuşa Shop - Online Dükkan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.6rem 1rem;
            border-radius: 20px;
            color: white;
            width: 250px;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .cart-icon {
            font-size: 1.5rem;
            cursor: pointer;
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Banner */
        .banner {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%);
            color: white;
            padding: 3rem 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 3rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .banner h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .banner p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Kategoriler */
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .category-btn {
            background: white;
            border: 2px solid #667eea;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            transition: all 0.3s;
            text-align: center;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* Ürün Grid */
        .products-section h3 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: #333;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .product-desc {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
        }

        .btn-add {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-add:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        /* Sepet Modal */
        .cart-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cart-content {
            background: white;
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }

        .cart-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            gap: 1rem;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .cart-item-price {
            color: #667eea;
            font-weight: bold;
        }

        .cart-item-qty {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .qty-btn {
            background: #f0f0f0;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .cart-footer {
            border-top: 2px solid #eee;
            padding: 1.5rem;
            background: #f9f9f9;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #333;
        }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .empty-cart {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        /* Footer */
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .cart-content {
                width: 100%;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .search-bar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">🛒 Yuşa Shop</div>
            <input type="text" class="search-bar" id="search-input" placeholder="Ürün ara...">
            <div class="cart-icon" id="cart-icon">
                🛍️
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <div class="container">
        <div class="banner">
            <h2>🎉 Yuşa Shop'a Hoşgeldiniz</h2>
            <p>En iyi ürünler, en uygun fiyatlar - Güvenli alışveriş</p>
        </div>

        <!-- Kategoriler -->
        <div class="categories" id="categories"></div>

        <!-- Ürünler -->
        <div class="products-section">
            <h3 id="category-title">Tüm Ürünler</h3>
            <div class="products-grid" id="products-grid"></div>
        </div>
    </div>

    <!-- Sepet Modal -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>🛒 Sepetim</h2>
                <button class="cart-close" id="cart-close">&times;</button>
            </div>
            <div class="cart-items" id="cart-items">
                <div class="empty-cart">Sepetiniz boş</div>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Toplam:</span>
                    <span id="cart-total">₺0</span>
                </div>
                <button class="btn-checkout" id="btn-checkout">Ödemeye Git</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Yuşa Shop - Tüm Hakları Saklıdır | 📞 +90 (555) 123-45-67 | 📧 info@yusashop.com</p>
    </footer>

    <script>
        // Ürün Veritabanı
        const products = [
            { id: 1, name: 'Wireless Kulaklık', price: 299, image: '🎧', category: 'elektronik', desc: 'Yüksek kalite ses' },
            { id: 2, name: 'USB-C Kablo', price: 49, image: '🔌', category: 'aksesuarlar', desc: 'Hızlı şarj' },
            { id: 3, name: 'Akıllı Saat', price: 899, image: '⌚', category: 'elektronik', desc: 'Fitness takibi' },
            { id: 4, name: 'Telefon Kılıfı', price: 79, image: '📱', category: 'aksesuarlar', desc: 'Koruma garantisi' },
            { id: 5, name: 'Tablet Stand', price: 129, image: '🎯', category: 'aksesuarlar', desc: 'Ayarlanabilir' },
            { id: 6, name: 'Power Bank', price: 199, image: '🔋', category: 'elektronik', desc: '10000mAh' },
            { id: 7, name: 'Klavye', price: 449, image: '⌨️', category: 'elektronik', desc: 'Mekanik' },
            { id: 8, name: 'Mouse Pad', price: 39, image: '🖱️', category: 'aksesuarlar', desc: 'Kaymaz taban' },
            { id: 9, name: 'Webcam HD', price: 349, image: '📷', category: 'elektronik', desc: '1080p' },
            { id: 10, name: 'HDMI Kablo', price: 59, image: '🎬', category: 'aksesuarlar', desc: '2 metre' },
            { id: 11, name: 'Ses Kolonu', price: 599, image: '🔊', category: 'elektronik', desc: 'Bluetooth' },
            { id: 12, name: 'Koruma Filmi', price: 19, image: '💎', category: 'aksesuarlar', desc: '3 adet' },
        ];

        const categories = ['Tüm Ürünler', 'elektronik', 'aksesuarlar'];
        let cart = [];
        let currentCategory = 'all';

        // DOM Elements
        const categoriesContainer = document.getElementById('categories');
        const productsGrid = document.getElementById('products-grid');
        const cartIcon = document.getElementById('cart-icon');
        const cartModal = document.getElementById('cart-modal');
        const cartClose = document.getElementById('cart-close');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCount = document.getElementById('cart-count');
        const cartTotal = document.getElementById('cart-total');
        const categoryTitle = document.getElementById('category-title');
        const searchInput = document.getElementById('search-input');

        // Kategoriler Oluştur
        function createCategories() {
            categoriesContainer.innerHTML = '';
            categories.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'category-btn ' + (idx === 0 ? 'active' : '');
                btn.textContent = cat === 'elektronik' ? '📱 Elektronik' : 
                                  cat === 'aksesuarlar' ? '🎁 Aksesuarlar' : '🏪 Tüm Ürünler';
                btn.addEventListener('click', () => filterByCategory(cat === 'Tüm Ürünler' ? 'all' : cat, btn));
                categoriesContainer.appendChild(btn);
            });
        }

        // Kategoriye Göre Filtrele
        function filterByCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (cat === 'all') {
                categoryTitle.textContent = 'Tüm Ürünler';
            } else if (cat === 'elektronik') {
                categoryTitle.textContent = '📱 Elektronik Ürünler';
            } else {
                categoryTitle.textContent = '🎁 Aksesuarlar';
            }
            
            displayProducts();
        }

        // Ürünleri Göster
        function displayProducts() {
            productsGrid.innerHTML = '';
            let filtered = products;

            if (currentCategory !== 'all') {
                filtered = products.filter(p => p.category === currentCategory);
            }

            if (searchInput.value) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchInput.value.toLowerCase())
                );
            }

            if (filtered.length === 0) {
                productsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem;">Ürün bulunamadı</p>';
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">${product.image}</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-desc">${product.desc}</div>
                        <div class="product-footer">
                            <div class="product-price">₺${product.price}</div>
                            <button class="btn-add" onclick="addToCart(${product.id})">Ekle</button>
                        </div>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
        }

        // Sepete Ekle
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(p => p.id === productId);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
        }

        // Sepeti Güncelle
        function updateCart() {
            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            updateCartDisplay();
        }

        // Sepet Ekranını Güncelle
        function updateCartDisplay() {
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-cart">Sepetiniz boş</div>';
                cartTotal.textContent = '₺0';
                return;
            }

            cartItemsContainer.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">₺${item.price}</div>
                    </div>
                    <div class="cart-item-qty">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">Kaldır</button>
                `;
                cartItemsContainer.appendChild(itemEl);
            });

            cartTotal.textContent = '₺' + total;
        }

        // Miktar Değiştir
        function changeQty(productId, change) {
            const item = cart.find(p => p.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCart();
                }
            }
        }

        // Sepetten Çıkar
        function removeFromCart(productId) {
            cart = cart.filter(p => p.id !== productId);
            updateCart();
        }

        // Sepet Modal
        cartIcon.addEventListener('click', () => {
            cartModal.style.display = 'block';
        });

        cartClose.addEventListener('click', () => {
            cartModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === cartModal) {
                cartModal.style.display = 'none';
            }
        });

        // Ödeme
        document.getElementById('btn-checkout').addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Sepetiniz boş!');
                return;
            }
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert(`✓ Siparişiniz alındı!\nToplam: ₺${total}\n\nÖdeme sayfasına yönlendiriliyorsunuz...`);
            cart = [];
            updateCart();
            cartModal.style.display = 'none';
        });

        // Arama
        searchInput.addEventListener('input', displayProducts);

        // Başlangıç
        createCategories();
        displayProducts();
    </script>

</body>
</html>

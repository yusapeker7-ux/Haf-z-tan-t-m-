<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Erişim Paneli</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .panel { border: 1px solid #0f0; padding: 20px; width: 300px; text-align: center; }
        button { background: #0f0; color: #000; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        video { width: 100%; border: 1px solid #0f0; margin-top: 10px; }
    </style>
</head>
<body>

<div class="panel">
    <input type="password" id="sifre" placeholder="Şifre: yus" style="width:100%; padding:10px; background:#222; color:#0f0; border:1px solid #0f0;">
    <button onclick="baslat()">SİSTEMİ BAŞLAT</button>
    <div id="kontrol" style="display:none;">
        <button onclick="kameraOl()">EVDEKİ TELEFON (KAMERA)</button>
        <button onclick="izle()">OKULDAKİ TELEFON (İZLE)</button>
    </div>
    <video id="v" autoplay playsinline muted></video>
</div>

<script>
    let peer;
    const SABIT_KEY = "benzersiz-anahtar-yus-2026";

    function baslat() {
        if(document.getElementById('sifre').value === 'yus') {
            document.getElementById('kontrol').style.display = 'block';
        }
    }

    async function kameraOl() {
        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}, audio: true});
        document.getElementById('v').srcObject = stream;
        peer = new Peer(SABIT_KEY);
        peer.on('call', call => { call.answer(stream); });
        alert("Evdeki telefon hazır. Kamerayı açık bırak.");
    }

    async function izle() {
        peer = new Peer();
        const call = peer.call(SABIT_KEY, await navigator.mediaDevices.getUserMedia({video: true, audio: true}));
        call.on('stream', s => document.getElementById('v').srcObject = s);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GÜVENLİ ERİŞİM | Kamera Paneli</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Consolas', monospace; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .panel-kutusu { background-color: #1a1a24; padding: 30px; border-radius: 12px; border: 1px solid #00f3ff; text-align: center; width: 90%; max-width: 500px; }
        button { width: 100%; padding: 15px; background-color: #00f3ff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0a0a0f; border: 1px solid #333; color: #00f3ff; border-radius: 6px; text-align: center; }
        .gizli { display: none !important; }
        video { width: 100%; background: #000; border-radius: 8px; border: 2px solid #333; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ekran-sifre" class="panel-kutusu">
        <h2>SİSTEME GİRİŞ</h2>
        <input type="password" id="sifre-girdi" placeholder="Şifre: yus">
        <button onclick="sifreKontrol()">DOĞRULA</button>
    </div>

    <div id="ekran-secim" class="panel-kutusu gizli">
        <h2>CİHAZ ROLÜ</h2>
        <button onclick="hazirlik('kamera')">BU CİHAZI KAMERA YAP</button>
        <button onclick="hazirlik('izle')">İZLEME PANELİNİ AÇ</button>
    </div>

    <div id="ekran-kamera" class="panel-kutusu gizli">
        <h2>KAMERA AKTİF</h2>
        <video id="yerel-video" autoplay playsinline muted></video>
        <div id="durum-kamera">İzin bekleniyor...</div>
    </div>

    <div id="ekran-izle" class="panel-kutusu gizli">
        <h2>CANLI İZLEME</h2>
        <video id="uzak-video" autoplay playsinline controls></video>
        <div id="durum-izle">Bağlantı kuruluyor...</div>
    </div>

    <script>
        const SABIT_ID = "kamera-sistemi-yus-2026";
        let peer = null;

        function sifreKontrol() {
            if(document.getElementById('sifre-girdi').value === "yus") {
                document.getElementById('ekran-sifre').classList.add('gizli');
                document.getElementById('ekran-secim').classList.remove('gizli');
            } else alert("Yanlış Şifre!");
        }

        async function hazirlik(mod) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('ekran-secim').classList.add('gizli');
                
                if(mod === 'kamera') {
                    document.getElementById('ekran-kamera').classList.remove('gizli');
                    document.getElementById('yerel-video').srcObject = stream;
                    peer = new Peer(SABIT_ID);
                    peer.on('call', call => { call.answer(stream); });
                    document.getElementById('durum-kamera').innerText = "● YAYINDA (İzinler Onaylandı)";
                } else {
                    document.getElementById('ekran-izle').classList.remove('gizli');
                    peer = new Peer();
                    setTimeout(() => {
                        const call = peer.call(SABIT_ID, stream);
                        call.on('stream', remoteStream => { document.getElementById('uzak-video').srcObject = remoteStream; });
                    }, 1000);
                }
            } catch (err) {
                alert("HATA: Kamera ve Mikrofon izni vermen gerekiyor!");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Sistemi</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; }
        button { width: 100%; padding: 20px; margin-top: 10px; cursor: pointer; background: #00f3ff; border: none; font-weight: bold; border-radius: 5px; }
        input { width: 100%; padding: 15px; box-sizing: border-box; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; }
        video { width: 100%; background: #000; margin-top: 15px; border-radius: 5px; }
        .gizli { display: none; }
    </style>
</head>
<body>

<div id="login-screen" class="box">
    <h3>SİSTEM GİRİŞİ</h3>
    <input type="password" id="sifre-input" placeholder="Şifre: yus">
    <button onclick="sifreKontrol()">GİRİŞ YAP</button>
</div>

<div id="main-screen" class="box gizli">
    <button onclick="kameraBaslat()">1. ADIM: KAMERA İZNİ VER VE BAŞLAT</button>
    <button onclick="izlemeyeGec()">2. ADIM: İZLEMEYE GEÇ</button>
    <video id="video-ekran" autoplay playsinline muted></video>
</div>

<script>
    let yerelStream = null;

    function sifreKontrol() {
        if(document.getElementById('sifre-input').value === 'yus') {
            document.getElementById('login-screen').classList.add('gizli');
            document.getElementById('main-screen').classList.remove('gizli');
        } else {
            alert('Şifre Hatalı!');
        }
    }

    // Bu fonksiyon butona bastığın anda tarayıcıya "İZİN İSTE" emrini verir
    async function kameraBaslat() {
        try {
            // İzin isteme anı burası (PC ve Mobilde direkt tetiklenir)
            yerelStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('video-ekran').srcObject = yerelStream;
            alert("İzin alındı! Kamera aktif.");
        } catch(err) {
            alert("İzin verilmedi! Kanka, tarayıcı ayarlarından kamera iznini manuel açman gerekebilir.");
        }
    }

    function izlemeyeGec() {
        if(!yerelStream) {
            alert("Önce 1. adımı yapıp izin vermen lazım!");
            return;
        }
        alert("Sistem hazır. Diğer cihazdan bağlanabilirsin.");
    }
</script>
</body>
</html>

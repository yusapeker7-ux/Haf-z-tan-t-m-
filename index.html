<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuşa Çiloğlan | Sesli AI Chatbot</title>
    <style>
        /* Temel Ayarlar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif, 'Segoe UI';
        }

        /* Ağırbaşlı Mat Siyah ve Loş Lacivert Geçişi */
        @keyframes portfolioBg {
            0% { background-color: #04060a; }
            50% { background-color: #0b111e; }
            100% { background-color: #04060a; }
        }

        body {
            animation: portfolioBg 12s ease-in-out infinite;
            color: #d1d5db;
            line-height: 1.8;
            padding: 0 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .voice-container {
            width: 100%;
            max-width: 600px;
            background: rgba(11, 15, 26, 0.95);
            border-radius: 12px;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            text-align: center;
        }

        header {
            margin-bottom: 3rem;
        }

        .arabic-banner {
            font-size: 1.4rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Mikrofon Animasyonu */
        .voice-circle {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.4), rgba(56, 189, 248, 0.1));
            border: 3px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.2), inset 0 0 40px rgba(56, 189, 248, 0.1);
        }

        .voice-circle.active {
            animation: voicePulse 1.5s ease-in-out infinite;
            border-color: rgba(239, 68, 68, 0.5);
            background: radial-gradient(circle at 30% 30%, rgba(239, 68, 68, 0.4), rgba(239, 68, 68, 0.1));
        }

        @keyframes voicePulse {
            0%, 100% {
                box-shadow: 0 0 40px rgba(239, 68, 68, 0.2), inset 0 0 40px rgba(239, 68, 68, 0.1);
            }
            50% {
                box-shadow: 0 0 80px rgba(239, 68, 68, 0.4), inset 0 0 40px rgba(239, 68, 68, 0.2);
            }
        }

        .mic-icon {
            font-size: 4rem;
        }

        .voice-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.3);
            animation: waveOut 1.5s ease-out infinite;
        }

        .voice-circle.active .wave {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .wave:nth-child(2) {
            animation-delay: 0.3s;
        }

        .wave:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes waveOut {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        /* Durumu Göster */
        .status-text {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            min-height: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-text.listening {
            color: #38bdf8;
            font-weight: 600;
        }

        .status-text.processing {
            color: #fbbf24;
            font-weight: 600;
        }

        .status-text.speaking {
            color: #34d399;
            font-weight: 600;
        }

        /* Mesajlar */
        .messages-box {
            background: rgba(30, 40, 70, 0.8);
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .messages-box::-webkit-scrollbar {
            width: 4px;
        }

        .messages-box::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 2px;
        }

        .message-item {
            margin-bottom: 0.8rem;
            padding: 0.6rem;
            border-left: 3px solid #38bdf8;
            padding-left: 0.8rem;
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.3;
        }

        .message-item.user {
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .message-item.ai {
            border-left-color: #34d399;
            background: rgba(52, 211, 153, 0.1);
        }

        /* Kontrol Butonları */
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 120px;
            justify-content: center;
        }

        .btn-voice {
            background: rgba(239, 68, 68, 0.5);
            color: #ffffff;
            border: 1px solid #ef4444;
            flex: 1;
        }

        .btn-voice:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.7);
            transform: scale(1.05);
        }

        .btn-voice:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-stop {
            background: rgba(239, 68, 68, 0.8);
            color: #ffffff;
            border: 1px solid #ef4444;
        }

        .btn-stop:hover {
            background: rgba(239, 68, 68, 0.9);
            transform: scale(1.05);
        }

        .btn-settings {
            background: rgba(34, 197, 194, 0.5);
            color: #ffffff;
            border: 1px solid #22c55e;
        }

        .btn-settings:hover {
            background: rgba(34, 197, 194, 0.7);
            transform: scale(1.05);
        }

        .btn-clear {
            background: rgba(100, 100, 120, 0.3);
            color: #cbd5e1;
            border: 1px solid #233554;
        }

        .btn-clear:hover {
            background: rgba(100, 100, 120, 0.5);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background: rgba(11, 15, 26, 0.95);
            margin: 15% auto;
            padding: 2rem;
            border: 1px solid #1e293b;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .close {
            color: #94a3b8;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close:hover {
            color: #38bdf8;
        }

        .modal h2 {
            margin-bottom: 1.5rem;
            color: #ffffff;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #233554;
            border-radius: 6px;
            font-size: 0.9rem;
            background: rgba(30, 40, 70, 0.8);
            color: #e0e7ff;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .modal-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .modal-buttons button {
            padding: 0.7rem 1.5rem;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #save-btn {
            background: rgba(56, 189, 248, 0.5);
            color: #ffffff;
            border: 1px solid #38bdf8;
        }

        #cancel-btn {
            background: rgba(100, 100, 120, 0.3);
            color: #cbd5e1;
            border: 1px solid #233554;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #86efac;
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 1rem 0 0 0;
            color: #475569;
            font-size: 0.75rem;
            letter-spacing: 1px;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="voice-container">
        <header>
            <div class="arabic-banner">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ</div>
            <h1>Sesli AI Chatbot</h1>
            <p class="subtitle">Hafızatan Tütüm - Gemini Powered</p>
        </header>

        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>

        <div class="voice-circle" id="voice-circle">
            <div class="voice-waves">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
            <div class="mic-icon">🎤</div>
        </div>

        <div class="status-text" id="status">Başlamak için "Dinle" butonuna tıkla</div>

        <div class="messages-box" id="messages-box">
            <div class="message-item ai">👋 Merhaba! Sesle konuş, ben dinleyip cevap vereceğim...</div>
        </div>

        <div class="controls">
            <button class="btn btn-voice" id="listen-btn">🎤 Dinle</button>
            <button class="btn btn-stop" id="stop-btn" style="display: none;">⏹️ Durdur</button>
        </div>

        <div class="controls">
            <button class="btn btn-clear" id="clear-btn">🗑️ Temizle</button>
            <button class="btn btn-settings" id="settings-btn">⚙️ Ayarlar</button>
        </div>

        <footer>
            <p>YÜŞA ÇİLOĞLAN &copy; 2026 | SESLİ AI CHATBOT</p>
        </footer>
    </div>

    <!-- Ayarlar Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>⚙️ Ayarlar</h2>
            <div class="form-group">
                <label for="api-key">Gemini API Key:</label>
                <input 
                    type="password" 
                    id="api-key" 
                    placeholder="API key'ini yapıştır"
                >
            </div>
            <div class="form-group">
                <label for="voice-lang">Ses Dili:</label>
                <select id="voice-lang">
                    <option value="tr-TR">Türkçe</option>
                    <option value="en-US">English</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="voice-response" checked>
                    AI sesli yanıt versin
                </label>
            </div>
            <div class="modal-buttons">
                <button id="cancel-btn">İptal</button>
                <button id="save-btn">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Konfigürasyon
        const config = {
            apiKey: localStorage.getItem('gemini-api-key') || '',
            voiceLang: localStorage.getItem('voice-lang') || 'tr-TR',
            voiceResponse: localStorage.getItem('voice-response') !== 'false',
            model: 'gemini-pro'
        };

        let conversationHistory = [];
        let isListening = false;
        let isSpeaking = false;

        // DOM Elements
        const voiceCircle = document.getElementById('voice-circle');
        const statusText = document.getElementById('status');
        const listenBtn = document.getElementById('listen-btn');
        const stopBtn = document.getElementById('stop-btn');
        const clearBtn = document.getElementById('clear-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const messagesBox = document.getElementById('messages-box');
        const modal = document.getElementById('settings-modal');
        const closeModal = document.querySelector('.close');
        const apiKeyInput = document.getElementById('api-key');
        const voiceLangSelect = document.getElementById('voice-lang');
        const voiceResponseCheck = document.getElementById('voice-response');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        // Modal Kontrolleri
        settingsBtn.addEventListener('click', () => {
            apiKeyInput.value = config.apiKey;
            voiceLangSelect.value = config.voiceLang;
            voiceResponseCheck.checked = config.voiceResponse;
            modal.style.display = 'block';
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        cancelBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        saveBtn.addEventListener('click', () => {
            const newApiKey = apiKeyInput.value.trim();
            if (!newApiKey) {
                showError('API Key boş olamaz!');
                return;
            }

            config.apiKey = newApiKey;
            config.voiceLang = voiceLangSelect.value;
            config.voiceResponse = voiceResponseCheck.checked;

            localStorage.setItem('gemini-api-key', config.apiKey);
            localStorage.setItem('voice-lang', config.voiceLang);
            localStorage.setItem('voice-response', config.voiceResponse);

            showSuccess('✓ Ayarlar kaydedildi!');
            modal.style.display = 'none';
        });

        // Status Güncelle
        function updateStatus(text, type = 'normal') {
            statusText.textContent = text;
            statusText.classList.remove('listening', 'processing', 'speaking');
            if (type !== 'normal') {
                statusText.classList.add(type);
            }
        }

        // Mesaj Ekle
        function addMessage(text, type = 'user') {
            const messageEl = document.createElement('div');
            messageEl.className = `message-item ${type}`;
            messageEl.textContent = text;
            messagesBox.appendChild(messageEl);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        // Hata Göster
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 5000);
        }

        // Başarı Göster
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }

        // Gemini API'ye Sorgu Gönder
        async function askGemini(userMessage) {
            if (!config.apiKey) {
                showError('❌ Lütfen API Key'i ayarlardan gir!');
                updateStatus('API Key gerekli');
                return;
            }

            try {
                updateStatus('🤔 Gemini'yi sorgulanıyor...', 'processing');

                conversationHistory.push({
                    role: 'user',
                    parts: [{ text: userMessage }]
                });

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: conversationHistory,
                            generationConfig: {
                                temperature: 0.7,
                                maxOutputTokens: 500,
                            }
                        })
                    }
                );

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Hatası');
                }

                const data = await response.json();
                const aiMessage = data.candidates[0].content.parts[0].text;

                conversationHistory.push({
                    role: 'model',
                    parts: [{ text: aiMessage }]
                });

                addMessage(aiMessage, 'ai');
                updateStatus('✓ Hazır! Yeni mesaj için tıkla', 'normal');

                if (config.voiceResponse) {
                    speakText(aiMessage);
                }

            } catch (error) {
                showError('❌ Hata: ' + error.message);
                updateStatus('Hata oluştu');
                console.error('Gemini API Error:', error);
            }
        }

        // Metni Sesli Oku
        function speakText(text) {
            if ('speechSynthesis' in window) {
                isSpeaking = true;
                voiceCircle.classList.add('active');
                updateStatus('🔊 Konuşuyor...', 'speaking');

                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLang;
                utterance.rate = 0.9;

                utterance.onend = () => {
                    isSpeaking = false;
                    voiceCircle.classList.remove('active');
                    updateStatus('✓ Hazır! Yeni mesaj için tıkla', 'normal');
                };

                speechSynthesis.speak(utterance);
            }
        }

        // Dinle Butonu
        listenBtn.addEventListener('click', async () => {
            if (isSpeaking) {
                showError('AI hâlâ konuşuyor, lütfen bekle...');
                return;
            }

            if (!config.apiKey) {
                showError('❌ Lütfen API Key'i ayarlardan gir!');
                return;
            }

            isListening = true;
            voiceCircle.classList.add('active');
            listenBtn.style.display = 'none';
            stopBtn.style.display = 'flex';
            updateStatus('👂 Dinleniyor...', 'listening');

            try {
                const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = config.voiceLang;
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }

                    if (transcript) {
                        addMessage(transcript, 'user');
                        updateStatus('✓ Tanındı: ' + transcript, 'normal');
                        askGemini(transcript);
                    }
                };

                recognition.onerror = (event) => {
                    isListening = false;
                    voiceCircle.classList.remove('active');
                    listenBtn.style.display = 'flex';
                    stopBtn.style.display = 'none';
                    showError('❌ Ses tanıma hatası: ' + event.error);
                    updateStatus('Hata oluştu');
                };

                recognition.onend = () => {
                    isListening = false;
                    voiceCircle.classList.remove('active');
                    listenBtn.style.display = 'flex';
                    stopBtn.style.display = 'none';
                };

                recognition.start();

            } catch (error) {
                isListening = false;
                voiceCircle.classList.remove('active');
                listenBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
                showError('❌ Mikrofon hatası: ' + error.message);
                updateStatus('Hata oluştu');
            }
        });

        // Durdur Butonu
        stopBtn.addEventListener('click', () => {
            if (isSpeaking) {
                speechSynthesis.cancel();
                isSpeaking = false;
            }
            isListening = false;
            voiceCircle.classList.remove('active');
            listenBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            updateStatus('✓ Durduruldu');
        });

        // Temizle Butonu
        clearBtn.addEventListener('click', () => {
            messagesBox.innerHTML = '<div class="message-item ai">👋 Merhaba! Sesle konuş, ben dinleyip cevap vereceğim...</div>';
            conversationHistory = [];
            updateStatus('✓ Temizlendi! Yeni sohbete başla');
        });

        // Sayfa Yüklendiğinde
        window.addEventListener('load', () => {
            if (config.apiKey) {
                showSuccess('✓ Sistem hazır - API Key yüklendi');
            } else {
                showError('⚠️ API Key ayarlarını yapılandır!');
            }
        });
    </script>

</body>
</html>

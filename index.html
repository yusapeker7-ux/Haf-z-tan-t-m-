<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot - Ses Destekli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 600px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            width: fit-content;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #message-input:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #send-btn:active {
            transform: translateY(0);
        }

        #voice-btn {
            background: #ff6b6b;
            color: white;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        #voice-btn:hover {
            background: #ff5252;
        }

        #voice-btn.recording {
            background: #ff4757;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(255, 71, 87, 0);
            }
        }

        #settings-btn {
            background: #4ecdc4;
            color: white;
            width: 44px;
            height: 44px;
            padding: 0;
        }

        #settings-btn:hover {
            background: #45b7b0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }

        #save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #cancel-btn {
            background: #ddd;
            color: #333;
        }

        .error {
            background: #ffe0e0;
            color: #c33;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
        }

        .success {
            background: #e0ffe0;
            color: #0c0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Gemini AI Chatbot</h1>
            <p>Hafızatan Tütüm - Ses Destekli Yapay Zeka</p>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message ai">
                <div class="message-content">
                    👋 Merhaba! Ben Gemini AI'ım. Seninle konuşmak için hazırım. Yazarak veya ses kaydederek mesaj gönderebilirsin!
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="error" id="error-msg"></div>
            <div class="success" id="success-msg"></div>
            <div class="input-group">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Mesajını yaz..." 
                    autocomplete="off"
                >
                <button id="voice-btn" title="Ses Kaydı Başlat">🎤</button>
                <button id="send-btn" title="Gönder">Gönder</button>
            </div>
            <button id="settings-btn" title="Ayarlar">⚙️</button>
        </div>
    </div>

    <!-- Ayarlar Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>⚙️ API Ayarları</h2>
            <div class="form-group">
                <label for="api-key">Gemini API Key:</label>
                <input 
                    type="password" 
                    id="api-key" 
                    placeholder="Buraya API key'ini yapıştır"
                >
            </div>
            <div class="form-group">
                <label for="voice-lang">Ses Dili:</label>
                <select id="voice-lang">
                    <option value="tr-TR">Türkçe</option>
                    <option value="en-US">English</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="voice-response" checked>
                    AI'ın sesli yanıt vermesini sağla
                </label>
            </div>
            <div class="modal-buttons">
                <button id="cancel-btn">İptal</button>
                <button id="save-btn">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Konfigürasyon
        const config = {
            apiKey: localStorage.getItem('gemini-api-key') || '',
            voiceLang: localStorage.getItem('voice-lang') || 'tr-TR',
            voiceResponse: localStorage.getItem('voice-response') !== 'false',
            model: 'gemini-1.5-flash'
        };

        // Konversasyon Hafızası
        let conversationHistory = [];

        // DOM Elements
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const modal = document.getElementById('settings-modal');
        const closeModal = document.querySelector('.close');
        const apiKeyInput = document.getElementById('api-key');
        const voiceLangSelect = document.getElementById('voice-lang');
        const voiceResponseCheck = document.getElementById('voice-response');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        // Modal Kontrolleri
        settingsBtn.addEventListener('click', () => {
            apiKeyInput.value = config.apiKey;
            voiceLangSelect.value = config.voiceLang;
            voiceResponseCheck.checked = config.voiceResponse;
            modal.style.display = 'block';
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        cancelBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        saveBtn.addEventListener('click', () => {
            const newApiKey = apiKeyInput.value.trim();
            if (!newApiKey) {
                showError('API Key boş olamaz!');
                return;
            }

            config.apiKey = newApiKey;
            config.voiceLang = voiceLangSelect.value;
            config.voiceResponse = voiceResponseCheck.checked;

            localStorage.setItem('gemini-api-key', config.apiKey);
            localStorage.setItem('voice-lang', config.voiceLang);
            localStorage.setItem('voice-response', config.voiceResponse);

            showSuccess('Ayarlar kaydedildi!');
            modal.style.display = 'none';
        });

        // Mesaj Göster
        function showMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Yazıyor göstergesi
        function showTyping() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'typing-indicator';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            
            messageDiv.appendChild(typingDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Yazıyor göstergesi kaldır
        function removeTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) {
                typing.remove();
            }
        }

        // Gemini API'ye istek gönder
        async function sendToGemini(userMessage) {
            if (!config.apiKey) {
                showError('Lütfen önce API Key ayarlarını yapılandır!');
                return;
            }

            try {
                showTyping();
                
                // Konversasyon geçmişine ekle
                conversationHistory.push({
                    role: 'user',
                    parts: [{ text: userMessage }]
                });

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: conversationHistory,
                            generationConfig: {
                                temperature: 0.7,
                                topK: 40,
                                topP: 0.95,
                                maxOutputTokens: 1024,
                            }
                        })
                    }
                );

                removeTyping();

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Hatası');
                }

                const data = await response.json();
                const aiMessage = data.candidates[0].content.parts[0].text;

                // Konversasyon geçmişine AI yanıtını ekle
                conversationHistory.push({
                    role: 'model',
                    parts: [{ text: aiMessage }]
                });

                showMessage(aiMessage, false);

                // Sesli yanıt
                if (config.voiceResponse) {
                    speakText(aiMessage);
                }

            } catch (error) {
                removeTyping();
                showError('Hata: ' + error.message);
                console.error('Gemini API Error:', error);
            }
        }

        // Metin konuş
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLang;
                utterance.rate = 0.95;
                speechSynthesis.speak(utterance);
            }
        }

        // Hata göster
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 5000);
        }

        // Başarı göster
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }

        // Gönder butonu
        sendBtn.addEventListener('click', () => {
            const message = messageInput.value.trim();
            if (!message) return;

            showMessage(message, true);
            messageInput.value = '';
            sendToGemini(message);
        });

        // Enter tuşu
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        // Ses Kaydı
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        voiceBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        await processAudio(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording');
                    voiceBtn.textContent = '⏹️';

                } catch (error) {
                    showError('Mikrofona erişim reddedildi: ' + error.message);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤';
            }
        });

        // Ses işle
        async function processAudio(audioBlob) {
            try {
                showMessage('🎤 Ses kaydı alındı...', true);
                
                const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = config.voiceLang;

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    if (transcript) {
                        messageInput.value = transcript;
                        sendBtn.click();
                    }
                };

                recognition.onerror = (event) => {
                    showError('Ses tanıma hatası: ' + event.error);
                };

            } catch (error) {
                showError('Ses işleme hatası: ' + error.message);
            }
        }

        // Sayfa yüklendiğinde
        window.addEventListener('load', () => {
            if (config.apiKey) {
                showSuccess('API Key yüklendi ✓');
            } else {
                showError('⚠️ Lütfen API Key ayarlarını yapılandır!');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesli AI - Yusa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes bg {
            0% { background-color: #04060a; }
            50% { background-color: #0b111e; }
            100% { background-color: #04060a; }
        }

        body {
            animation: bg 12s ease-in-out infinite;
            color: #d1d5db;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .mic-circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.5), rgba(56, 189, 248, 0.1));
            border: 4px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.3), inset 0 0 60px rgba(56, 189, 248, 0.1);
            cursor: pointer;
            transition: all 0.3s;
        }

        .mic-circle:hover {
            transform: scale(1.05);
        }

        .mic-circle.listening {
            animation: pulse 1.2s infinite;
            border-color: rgba(239, 68, 68, 0.6);
            background: radial-gradient(circle at 30% 30%, rgba(239, 68, 68, 0.5), rgba(239, 68, 68, 0.1));
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 60px rgba(239, 68, 68, 0.3), inset 0 0 60px rgba(239, 68, 68, 0.1);
            }
            50% {
                box-shadow: 0 0 100px rgba(239, 68, 68, 0.5), inset 0 0 60px rgba(239, 68, 68, 0.2);
            }
        }

        .mic-icon {
            font-size: 6rem;
        }

        .waves {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.3);
            top: 0;
            left: 0;
        }

        .mic-circle.listening .wave {
            border-color: rgba(239, 68, 68, 0.3);
            animation: expand 1.2s infinite;
        }

        .wave:nth-child(1) { animation-delay: 0s; }
        .wave:nth-child(2) { animation-delay: 0.4s; }
        .wave:nth-child(3) { animation-delay: 0.8s; }

        @keyframes expand {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .label {
            position: absolute;
            top: 20px;
            font-size: 1.2rem;
            color: #38bdf8;
            font-weight: bold;
            text-align: center;
        }

        .status {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: center;
            width: 80%;
        }

        .settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(34, 197, 194, 0.6);
            border: 2px solid #22c55e;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(34, 197, 194, 0.3);
        }

        .settings-btn:hover {
            background: rgba(34, 197, 194, 0.8);
            transform: scale(1.1);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background: rgba(11, 15, 26, 0.95);
            margin: 20% auto;
            padding: 2rem;
            border: 2px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .modal h2 {
            color: #38bdf8;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            background: rgba(30, 40, 70, 0.8);
            color: #e0e7ff;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .modal-buttons button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background: rgba(56, 189, 248, 0.6);
            color: white;
            border: 1px solid #38bdf8;
        }

        .btn-save:hover {
            background: rgba(56, 189, 248, 0.8);
        }

        .btn-cancel {
            background: rgba(100, 100, 120, 0.4);
            color: #cbd5e1;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .btn-cancel:hover {
            background: rgba(100, 100, 120, 0.6);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #38bdf8;
        }

        .error-msg {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 6px;
            z-index: 2000;
            max-width: 300px;
        }

        .success-msg {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #86efac;
            padding: 1rem;
            border-radius: 6px;
            z-index: 2000;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <div class="mic-circle" id="mic-circle">
        <div class="label">🎤 TIK</div>
        <div class="waves" id="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        <div class="mic-icon">🎤</div>
        <div class="status" id="status">Konuşmaya başla</div>
    </div>

    <button class="settings-btn" id="settings-btn">⚙️</button>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-btn">&times;</span>
            <h2>⚙️ Ayarlar</h2>
            
            <div class="form-group">
                <label for="api-key">API Key:</label>
                <input type="password" id="api-key" placeholder="Gemini API Key">
            </div>

            <div class="form-group">
                <label for="lang">Dil:</label>
                <select id="lang">
                    <option value="tr-TR">Türkçe</option>
                    <option value="en-US">English</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="voice-response" checked>
                    Sesle cevap ver
                </label>
            </div>

            <div class="modal-buttons">
                <button class="btn-save" id="save-btn">Kaydet</button>
                <button class="btn-cancel" id="cancel-btn">İptal</button>
            </div>
        </div>
    </div>

    <script>
        const config = {
            apiKey: localStorage.getItem('api-key') || '',
            lang: localStorage.getItem('lang') || 'tr-TR',
            voiceResponse: localStorage.getItem('voice-response') !== 'false'
        };

        const micCircle = document.getElementById('mic-circle');
        const status = document.getElementById('status');
        const modal = document.getElementById('modal');
        const settingsBtn = document.getElementById('settings-btn');
        const closeBtn = document.getElementById('close-btn');
        const apiKeyInput = document.getElementById('api-key');
        const langSelect = document.getElementById('lang');
        const voiceResponseCheck = document.getElementById('voice-response');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        let isListening = false;
        let conversationHistory = [];

        // Settings Modal
        settingsBtn.addEventListener('click', () => {
            apiKeyInput.value = config.apiKey;
            langSelect.value = config.lang;
            voiceResponseCheck.checked = config.voiceResponse;
            modal.style.display = 'block';
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        cancelBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        saveBtn.addEventListener('click', () => {
            if (!apiKeyInput.value.trim()) {
                showError('API Key gerekli!');
                return;
            }
            config.apiKey = apiKeyInput.value.trim();
            config.lang = langSelect.value;
            config.voiceResponse = voiceResponseCheck.checked;
            
            localStorage.setItem('api-key', config.apiKey);
            localStorage.setItem('lang', config.lang);
            localStorage.setItem('voice-response', config.voiceResponse);
            
            showSuccess('Kaydedildi!');
            modal.style.display = 'none';
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 4000);
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.style.display = 'block';
            setTimeout(() => successMsg.style.display = 'none', 3000);
        }

        function updateStatus(text) {
            status.textContent = text;
        }

        async function askGemini(text) {
            if (!config.apiKey) {
                showError('API Key gerekli! Ayarları açın.');
                updateStatus('Hata');
                return;
            }

            try {
                updateStatus('🤔 Düşünüyor...');

                conversationHistory.push({
                    role: 'user',
                    parts: [{ text }]
                });

                const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${config.apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: conversationHistory,
                            generationConfig: { maxOutputTokens: 300 }
                        })
                    }
                );

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error?.message || 'API Hatası');
                }

                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;

                conversationHistory.push({
                    role: 'model',
                    parts: [{ text: reply }]
                });

                updateStatus('🔊 Cevaplanıyor...');

                if (config.voiceResponse) {
                    speakText(reply);
                } else {
                    updateStatus('Konuşmaya başla');
                }

            } catch (error) {
                showError('Hata: ' + error.message);
                updateStatus('Hata');
            }
        }

        function speakText(text) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = config.lang;
            utterance.rate = 0.9;
            utterance.onend = () => {
                updateStatus('Konuşmaya başla');
            };
            speechSynthesis.speak(utterance);
        }

        // Mic Click
        micCircle.addEventListener('click', () => {
            if (isListening) return;

            isListening = true;
            micCircle.classList.add('listening');
            updateStatus('Dinleniyor...');

            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = config.lang;
            recognition.continuous = false;

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                if (transcript) {
                    updateStatus('Anlaşıldı: ' + transcript);
                    askGemini(transcript);
                }
            };

            recognition.onerror = (event) => {
                showError('Ses hatası: ' + event.error);
                isListening = false;
                micCircle.classList.remove('listening');
                updateStatus('Konuşmaya başla');
            };

            recognition.onend = () => {
                isListening = false;
                micCircle.classList.remove('listening');
            };

            recognition.start();
        });

        window.addEventListener('load', () => {
            if (config.apiKey) {
                showSuccess('Hazır!');
            } else {
                showError('API Key gerekli');
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot - Holografik Ses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 14, 39, 0.95);
            border-radius: 30px;
            box-shadow: 0 0 60px rgba(102, 126, 234, 0.3), inset 0 0 60px rgba(102, 126, 234, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
            border: 2px solid rgba(102, 126, 234, 0.4);
            position: relative;
        }

        /* Holografik Arka Plan Efekti */
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 0%, 
                rgba(102, 126, 234, 0.1) 25%, 
                transparent 50%, 
                rgba(118, 75, 162, 0.1) 75%, 
                transparent 100%);
            animation: holoDrift 20s linear infinite;
            pointer-events: none;
        }

        @keyframes holoDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100px, 100px) rotate(360deg); }
        }

        .header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
            position: relative;
            z-index: 2;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        .hologram-sphere {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sphere-core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.4));
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.6), inset -20px -20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            animation: sphereFloat 3s ease-in-out infinite;
        }

        @keyframes sphereFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .sound-wave {
            position: absolute;
            border: 2px solid rgba(102, 126, 234, 0.5);
            border-radius: 50%;
            animation: waveExpand 1.5s ease-out infinite;
        }

        .sound-wave:nth-child(1) {
            animation-delay: 0s;
            width: 40px;
            height: 40px;
        }

        .sound-wave:nth-child(2) {
            animation-delay: 0.5s;
            width: 60px;
            height: 60px;
        }

        .sound-wave:nth-child(3) {
            animation-delay: 1s;
            width: 80px;
            height: 80px;
        }

        @keyframes waveExpand {
            0% {
                transform: scale(0.3);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(15, 20, 40, 0.9);
            position: relative;
            z-index: 2;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: rgba(102, 126, 234, 0.1);
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.4);
            border-radius: 4px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 15px;
            word-wrap: break-word;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8) 0%, rgba(118, 75, 162, 0.8) 100%);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        .message.ai .message-content {
            background: rgba(30, 40, 70, 0.8);
            color: #e0e7ff;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 18px;
            background: rgba(30, 40, 70, 0.8);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            width: fit-content;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .typing span {
            width: 10px;
            height: 10px;
            background: rgba(102, 126, 234, 0.8);
            border-radius: 50%;
            animation: typeBounce 1.4s infinite;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.6);
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typeBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            30% {
                transform: translateY(-12px);
                opacity: 1;
            }
        }

        .input-area {
            padding: 20px;
            background: rgba(10, 15, 30, 0.95);
            border-top: 2px solid rgba(102, 126, 234, 0.3);
            display: flex;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: rgba(30, 40, 70, 0.6);
            color: #e0e7ff;
            transition: all 0.3s;
        }

        #message-input::placeholder {
            color: rgba(224, 231, 255, 0.4);
        }

        #message-input:focus {
            border-color: rgba(102, 126, 234, 0.8);
            background: rgba(30, 40, 70, 0.8);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #send-btn {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8) 0%, rgba(118, 75, 162, 0.8) 100%);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.5);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        #send-btn:active {
            transform: translateY(0);
        }

        #voice-btn {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.8) 0%, rgba(255, 71, 87, 0.8) 100%);
            color: white;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(255, 107, 107, 0.5);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        #voice-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }

        #voice-btn.recording {
            animation: micPulse 1s infinite;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
        }

        @keyframes micPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 50px rgba(255, 71, 87, 0.8);
            }
        }

        #settings-btn {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.8) 0%, rgba(69, 183, 176, 0.8) 100%);
            color: white;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(78, 205, 196, 0.5);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }

        #settings-btn:hover {
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s;
            backdrop-filter: blur(5px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(20, 30, 60, 0.95) 0%, rgba(30, 40, 70, 0.95) 100%);
            margin: 10% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(102, 126, 234, 0.3);
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.6);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #e0e7ff;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(30, 40, 70, 0.6);
            color: #e0e7ff;
        }

        .form-group input::placeholder {
            color: rgba(224, 231, 255, 0.4);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }

        #save-btn {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8) 0%, rgba(118, 75, 162, 0.8) 100%);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        #cancel-btn {
            background: rgba(100, 100, 120, 0.6);
            color: #e0e7ff;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.5);
            color: #ff9999;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.2);
        }

        .success {
            background: rgba(102, 255, 102, 0.2);
            border: 1px solid rgba(102, 255, 102, 0.5);
            color: #99ff99;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
            box-shadow: 0 0 15px rgba(102, 255, 102, 0.2);
        }

        .permission-request {
            background: rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.4);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            color: #e0e7ff;
            margin-bottom: 10px;
            display: none;
        }

        .permission-request button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="hologram-sphere">
                <div class="sphere-core">
                    <div class="sound-wave"></div>
                    <div class="sound-wave"></div>
                    <div class="sound-wave"></div>
                </div>
            </div>
            <h1>🤖 Gemini AI Chatbot</h1>
            <p>Holografik Ses Destekli - Konuş & Dinle</p>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message ai">
                <div class="message-content">
                    👋 Merhaba! Ben Gemini AI'ım. Seninle sesle konuşmaya hazırım! 🎤
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="error" id="error-msg"></div>
            <div class="success" id="success-msg"></div>
            <div class="permission-request" id="permission-request">
                🎤 Mikrofon için izin gerekli
                <button onclick="requestMicrophonePermission()">İzin Ver</button>
            </div>
            <div class="input-group">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Mesajını yaz veya mikrofonu kullan..." 
                    autocomplete="off"
                >
                <button id="voice-btn" title="Ses Kaydı Başlat">🎤</button>
                <button id="send-btn" title="Gönder">Gönder</button>
            </div>
            <button id="settings-btn" title="Ayarlar">⚙️</button>
        </div>
    </div>

    <!-- Ayarlar Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>⚙️ API Ayarları</h2>
            <div class="form-group">
                <label for="api-key">Gemini API Key:</label>
                <input 
                    type="password" 
                    id="api-key" 
                    placeholder="Buraya API key'ini yapıştır"
                >
            </div>
            <div class="form-group">
                <label for="voice-lang">Ses Dili:</label>
                <select id="voice-lang">
                    <option value="tr-TR">Türkçe</option>
                    <option value="en-US">English</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="voice-response" checked>
                    AI'ın sesli yanıt vermesini sağla
                </label>
            </div>
            <div class="modal-buttons">
                <button id="cancel-btn">İptal</button>
                <button id="save-btn">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Konfigürasyon
        const config = {
            apiKey: localStorage.getItem('gemini-api-key') || '',
            voiceLang: localStorage.getItem('voice-lang') || 'tr-TR',
            voiceResponse: localStorage.getItem('voice-response') !== 'false',
            model: 'gemini-pro'  // DÜZELTILDI: Doğru model
        };

        let conversationHistory = [];
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // DOM Elements
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const modal = document.getElementById('settings-modal');
        const closeModal = document.querySelector('.close');
        const apiKeyInput = document.getElementById('api-key');
        const voiceLangSelect = document.getElementById('voice-lang');
        const voiceResponseCheck = document.getElementById('voice-response');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const permissionRequest = document.getElementById('permission-request');

        // Modal Kontrolleri
        settingsBtn.addEventListener('click', () => {
            apiKeyInput.value = config.apiKey;
            voiceLangSelect.value = config.voiceLang;
            voiceResponseCheck.checked = config.voiceResponse;
            modal.style.display = 'block';
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        cancelBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        saveBtn.addEventListener('click', () => {
            const newApiKey = apiKeyInput.value.trim();
            if (!newApiKey) {
                showError('API Key boş olamaz!');
                return;
            }

            config.apiKey = newApiKey;
            config.voiceLang = voiceLangSelect.value;
            config.voiceResponse = voiceResponseCheck.checked;

            localStorage.setItem('gemini-api-key', config.apiKey);
            localStorage.setItem('voice-lang', config.voiceLang);
            localStorage.setItem('voice-response', config.voiceResponse);

            showSuccess('✓ Ayarlar kaydedildi!');
            modal.style.display = 'none';
        });

        // Mesaj Göster
        function showMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Yazıyor göstergesi
        function showTyping() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'typing-indicator';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            
            messageDiv.appendChild(typingDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) {
                typing.remove();
            }
        }

        // Gemini API'ye istek gönder
        async function sendToGemini(userMessage) {
            if (!config.apiKey) {
                showError('❌ Lütfen API Key ayarlarını yapılandır!');
                return;
            }

            try {
                showTyping();
                
                conversationHistory.push({
                    role: 'user',
                    parts: [{ text: userMessage }]
                });

                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: conversationHistory,
                            generationConfig: {
                                temperature: 0.7,
                                topK: 40,
                                topP: 0.95,
                                maxOutputTokens: 1024,
                            }
                        })
                    }
                );

                removeTyping();

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'API Hatası');
                }

                const data = await response.json();
                const aiMessage = data.candidates[0].content.parts[0].text;

                conversationHistory.push({
                    role: 'model',
                    parts: [{ text: aiMessage }]
                });

                showMessage(aiMessage, false);

                if (config.voiceResponse) {
                    speakText(aiMessage);
                }

            } catch (error) {
                removeTyping();
                showError('❌ Hata: ' + error.message);
                console.error('Gemini API Error:', error);
            }
        }

        // Metin konuş
        function speakText(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel(); // Önceki sesi durdur
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = config.voiceLang;
                utterance.rate = 0.9;
                utterance.pitch = 1;
                speechSynthesis.speak(utterance);
            }
        }

        // Hata göster
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 5000);
        }

        // Başarı göster
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }

        // Gönder butonu
        sendBtn.addEventListener('click', () => {
            const message = messageInput.value.trim();
            if (!message) return;

            showMessage(message, true);
            messageInput.value = '';
            sendToGemini(message);
        });

        // Enter tuşu
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        // Mikrofon İzni İste
        async function requestMicrophonePermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                permissionRequest.style.display = 'none';
                showSuccess('✓ Mikrofon erişimi verildi!');
            } catch (error) {
                showError('❌ Mikrofon erişimi reddedildi: ' + error.message);
            }
        }

        window.requestMicrophonePermission = requestMicrophonePermission;

        // Ses Kaydı
        voiceBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        await processAudio();
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording');
                    voiceBtn.textContent = '⏹️';
                    showSuccess('🎤 Ses kaydı başladı...');

                } catch (error) {
                    if (error.name === 'NotAllowedError') {
                        permissionRequest.style.display = 'block';
                    }
                    showError('❌ Mikrofona erişim reddedildi');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤';
            }
        });

        // Ses işle
        async function processAudio() {
            try {
                const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = config.voiceLang;
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    showSuccess('🎙️ Ses tanınıyor...');
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    
                    if (transcript) {
                        messageInput.value = transcript;
                        showSuccess('✓ Tanındı: ' + transcript);
                        sendBtn.click();
                    }
                };

                recognition.onerror = (event) => {
                    showError('❌ Ses tanıma hatası: ' + event.error);
                };

                recognition.start();

            } catch (error) {
                showError('❌ Ses işleme hatası: ' + error.message);
            }
        }

        // Sayfa yüklendiğinde
        window.addEventListener('load', () => {
            if (config.apiKey) {
                showSuccess('✓ Sistem hazır - API Key yüklendi');
            } else {
                showError('⚠️ Lütfen API Key ayarlarını yapılandır!');
            }
        });
    </script>
</body>
</html>
